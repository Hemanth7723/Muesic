name: Publish Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------------
      # 1. Checkout repository
      # ---------------------------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------------------------------------------------------
      # 2. Setup JDK 21
      # ---------------------------------------------------------
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      # ---------------------------------------------------------
      # 3. Make Gradle executable
      # ---------------------------------------------------------
      - name: Grant Execute Permission for Gradlew
        run: chmod +x ./gradlew

      # ---------------------------------------------------------
      # 4. Decode release keystore
      # ---------------------------------------------------------
      - name: Decode Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 GitHub secret is missing."
            exit 1
          fi

          mkdir -p app

          echo "$KEYSTORE_BASE64" | base64 --decode > app/my-upload-key.jks

          if [ ! -f app/my-upload-key.jks ]; then
            echo "ERROR: Failed to create release keystore."
            exit 1
          fi

          echo "Release keystore created successfully."

      # ---------------------------------------------------------
      # 5. Verify keystore and alias
      # ---------------------------------------------------------
      - name: Verify Release Keystore
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$STORE_PASSWORD" ]; then
            echo "ERROR: STORE_PASSWORD secret is missing."
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: KEY_ALIAS secret is missing."
            exit 1
          fi

          keytool -list \
            -keystore app/my-upload-key.jks \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            > /dev/null

          echo "Release keystore and alias verified successfully."

      # ---------------------------------------------------------
      # 6. Extract Git metadata
      # ---------------------------------------------------------
      - name: Extract Git Metadata
        run: |
          GIT_TAG=$(git describe --tags --exact-match 2>/dev/null || echo "$GITHUB_REF_NAME")
          GIT_COMMIT_DATE=$(git log -1 --format=%cd --date=format:"%B %d, %Y")
          GIT_COMMIT_HASH=$(git rev-parse --short HEAD)

          echo "GIT_TAG=$GIT_TAG" >> "$GITHUB_ENV"
          echo "GIT_COMMIT_DATE=$GIT_COMMIT_DATE" >> "$GITHUB_ENV"
          echo "GIT_COMMIT_HASH=$GIT_COMMIT_HASH" >> "$GITHUB_ENV"

          echo "======================================"
          echo "Muesic Release Build"
          echo "======================================"
          echo "Tag:    $GIT_TAG"
          echo "Date:   $GIT_COMMIT_DATE"
          echo "Commit: $GIT_COMMIT_HASH"
          echo "======================================"

      # ---------------------------------------------------------
      # 7. Build signed release APK
      # ---------------------------------------------------------
      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/app/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

          GIT_TAG: ${{ env.GIT_TAG }}
          GIT_COMMIT_DATE: ${{ env.GIT_COMMIT_DATE }}
          GIT_COMMIT_HASH: ${{ env.GIT_COMMIT_HASH }}

          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}

        run: |
          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: KEY_PASSWORD GitHub secret is missing."
            exit 1
          fi

          echo "Building signed release APK..."

          ./gradlew clean assembleRelease --stacktrace

      # ---------------------------------------------------------
      # 8. Verify generated APK
      # ---------------------------------------------------------
      - name: Verify Release APK
        run: |
          echo "Generated APK files:"
          find app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            -print

          APK_COUNT=$(find app/build/outputs/apk/release \
            -type f \
            -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No release APK was generated."
            exit 1
          fi

          echo "Found $APK_COUNT APK file(s)."

      # ---------------------------------------------------------
      # 9. Rename APK
      # ---------------------------------------------------------
      - name: Rename APK
        run: |
          APK=$(find app/build/outputs/apk/release \
            -type f \
            -name "*.apk" | head -n 1)

          OUTPUT="app/build/outputs/apk/release/Muesic_${GITHUB_REF_NAME}.apk"

          mv "$APK" "$OUTPUT"

          echo "======================================"
          echo "Final APK"
          echo "======================================"

          ls -lh "$OUTPUT"

      # ---------------------------------------------------------
      # 10. Verify APK signing
      # ---------------------------------------------------------
      - name: Verify APK Signature
        run: |
          APK="app/build/outputs/apk/release/Muesic_${GITHUB_REF_NAME}.apk"

          echo "Verifying APK signature..."

          $ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apksigner verify \
            --verbose \
            "$APK"

          echo "APK signature verified successfully."

      # ---------------------------------------------------------
      # 11. Create GitHub Release
      # ---------------------------------------------------------
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/Muesic_${{ github.ref_name }}.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
