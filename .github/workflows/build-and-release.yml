name: Publish Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-main-tag:
    name: Verify tagged commit is on main
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      eligible: ${{ steps.check.outputs.eligible }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check tagged commit is reachable from main
        id: check
        run: |
          git fetch origin main
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "eligible=true" >> "$GITHUB_OUTPUT"
            echo "Tagged commit is on main; continuing release build."
          else
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "Tagged commit is not on main; skipping release build."
          fi

  build:
    name: Build & Release APK
    needs: verify-main-tag
    if: github.event_name == 'push' && needs.verify-main-tag.outputs.eligible == 'true'
    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------------
      # CHECKOUT
      # ---------------------------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------------------------------------------------------
      # JAVA
      # ---------------------------------------------------------
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # ---------------------------------------------------------
      # GRADLE
      # ---------------------------------------------------------
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # ---------------------------------------------------------
      # DECODE RELEASE KEYSTORE
      # ---------------------------------------------------------
      - name: Decode Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 GitHub secret is missing."
            exit 1
          fi

          mkdir -p app

          echo "$KEYSTORE_BASE64" | base64 --decode > app/my-upload-key.jks

          if [ ! -f app/my-upload-key.jks ]; then
            echo "ERROR: Failed to create release keystore."
            exit 1
          fi

          if [ ! -s app/my-upload-key.jks ]; then
            echo "ERROR: Release keystore is empty."
            exit 1
          fi

          echo "Release keystore created successfully."

      # ---------------------------------------------------------
      # VERIFY RELEASE KEYSTORE
      # ---------------------------------------------------------
      - name: Verify Release Keystore
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$STORE_PASSWORD" ]; then
            echo "ERROR: STORE_PASSWORD GitHub secret is missing."
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: KEY_ALIAS GitHub secret is missing."
            exit 1
          fi

          echo "Verifying release keystore..."

          keytool -list \
            -keystore app/my-upload-key.jks \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            > /dev/null

          echo "Release keystore and alias verified successfully."

      # ---------------------------------------------------------
      # EXTRACT GIT METADATA
      # ---------------------------------------------------------
      - name: Extract Git Metadata
        id: metadata
        run: |
          GIT_COMMIT_HASH=$(git rev-parse --short HEAD)
          GIT_TAG="$GITHUB_REF_NAME"
          GIT_COMMIT_DATE=$(git log -1 --format=%cd --date=format:"%B %d, %Y")

          echo "tag=$GIT_TAG" >> "$GITHUB_OUTPUT"
          echo "commit_date=$GIT_COMMIT_DATE" >> "$GITHUB_OUTPUT"
          echo "commit_hash=$GIT_COMMIT_HASH" >> "$GITHUB_OUTPUT"

          echo "======================================"
          echo "Muesic Release Build"
          echo "======================================"
          echo "Tag:    $GIT_TAG"
          echo "Date:   $GIT_COMMIT_DATE"
          echo "Commit: $GIT_COMMIT_HASH"
          echo "======================================"

      # ---------------------------------------------------------
      # BUILD RELEASE APK
      # ---------------------------------------------------------
      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/app/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

          GIT_TAG: ${{ steps.metadata.outputs.tag }}
          GIT_COMMIT_DATE: ${{ steps.metadata.outputs.commit_date }}
          GIT_COMMIT_HASH: ${{ steps.metadata.outputs.commit_hash }}

          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}

        run: |
          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: KEY_PASSWORD GitHub secret is missing."
            exit 1
          fi

          echo "Building signed release APK..."
          gradle clean assembleRelease --stacktrace

      # ---------------------------------------------------------
      # VERIFY APK EXISTS
      # ---------------------------------------------------------
      - name: Verify Release APK
        run: |
          echo "Generated APK files:"

          OUTPUT_DIR="app/build/outputs/apk/release"
          find "$OUTPUT_DIR" \
            -type f \
            -name "*.apk" \
            -print

          APK_COUNT=$(find "$OUTPUT_DIR" -type f -name "*.apk" | wc -l)
          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No release APK was generated."
            exit 1
          fi

          echo "Found $APK_COUNT APK file(s)."

      # ---------------------------------------------------------
      # RENAME UNIVERSAL AND ABI-SPECIFIC APKs
      # ---------------------------------------------------------
      - name: Rename APKs
        env:
          GIT_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          OUTPUT_DIR="app/build/outputs/apk/release"
          FOUND_APK=false

          while IFS= read -r -d '' APK; do
            FILE_NAME=$(basename "$APK")
            case "$FILE_NAME" in
              app-universal-release.apk)
                OUTPUT="$OUTPUT_DIR/Muesic_${GIT_TAG}.apk"
                ;;
              app-*-release.apk)
                ABI="${FILE_NAME#app-}"
                ABI="${ABI%-release.apk}"
                OUTPUT="$OUTPUT_DIR/Muesic_${GIT_TAG}_${ABI}.apk"
                ;;
              *)
                echo "ERROR: Unexpected release APK name: $FILE_NAME"
                exit 1
                ;;
            esac

            mv "$APK" "$OUTPUT"
            FOUND_APK=true
          done < <(find "$OUTPUT_DIR" -maxdepth 1 -type f -name "*.apk" -print0)

          if [ "$FOUND_APK" != true ]; then
            echo "ERROR: No APKs were available to rename."
            exit 1
          fi

          for APK in \
            "$OUTPUT_DIR/Muesic_${GIT_TAG}.apk" \
            "$OUTPUT_DIR/Muesic_${GIT_TAG}_arm64-v8a.apk" \
            "$OUTPUT_DIR/Muesic_${GIT_TAG}_armeabi-v7a.apk" \
            "$OUTPUT_DIR/Muesic_${GIT_TAG}_x86.apk" \
            "$OUTPUT_DIR/Muesic_${GIT_TAG}_x86_64.apk"; do
            if [ ! -s "$APK" ]; then
              echo "ERROR: Expected release APK was not generated: $APK"
              exit 1
            fi
          done

          ls -lh "$OUTPUT_DIR"/Muesic_"${GIT_TAG}"*.apk

      # ---------------------------------------------------------
      # VERIFY APK SIGNATURE
      # ---------------------------------------------------------
      - name: Verify APK Signature
        env:
          GIT_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          echo "Verifying APK signature..."

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -name apksigner \
            -type f | sort -V | tail -n 1)

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner was not found."
            exit 1
          fi

          shopt -s nullglob
          APKS=(app/build/outputs/apk/release/Muesic_"${GIT_TAG}"*.apk)
          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "ERROR: No renamed release APKs were found."
            exit 1
          fi

          for APK in "${APKS[@]}"; do
            "$APKSIGNER" verify --verbose "$APK"
          done

          echo "All APK signatures verified successfully."

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/Muesic_${{ steps.metadata.outputs.tag }}.apk
            app/build/outputs/apk/release/Muesic_${{ steps.metadata.outputs.tag }}_arm64-v8a.apk
            app/build/outputs/apk/release/Muesic_${{ steps.metadata.outputs.tag }}_armeabi-v7a.apk
            app/build/outputs/apk/release/Muesic_${{ steps.metadata.outputs.tag }}_x86.apk
            app/build/outputs/apk/release/Muesic_${{ steps.metadata.outputs.tag }}_x86_64.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  manual-build:
    name: Build Debug APKs (manual run)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APKs
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: gradle clean assembleDebug --stacktrace

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: Muesic-debug-${{ github.ref_name }}-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
