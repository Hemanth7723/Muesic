name: Publish Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: |
          if [ -f gradlew ]; then chmod +x gradlew; fi

      # If the keystore secret is available, decode it to the target file
      - name: Decode Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > app/my-upload-key.jks

      - name: Extract Git Metadata for Build
        id: git_info
        run: |
          GIT_TAG=$(git describe --tags --exact-match 2>/dev/null || echo "${{ github.ref_name }}")
          GIT_COMMIT_DATE=$(git log -1 --format=%cd --date=format:"%B %d, %Y" 2>/dev/null || date +"%B %d, %Y")
          GIT_COMMIT_HASH=$(git rev-parse --short HEAD 2>/dev/null || echo "${{ github.sha }}")
          echo "tag=$GIT_TAG" >> $GITHUB_ENV
          echo "commit_date=$GIT_COMMIT_DATE" >> $GITHUB_ENV
          echo "commit_hash=$GIT_COMMIT_HASH" >> $GITHUB_ENV
          echo "Building Muesic with Tag: $GIT_TAG, Date: $GIT_COMMIT_DATE, Commit: $GIT_COMMIT_HASH"

      - name: Build Release APK
        env:
          KEYSTORE_PATH: my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GIT_TAG: ${{ env.tag }}
          GIT_COMMIT_DATE: ${{ env.commit_date }}
          GIT_COMMIT_HASH: ${{ env.commit_hash }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ -f gradlew ]; then
            ./gradlew assembleRelease
          else
            gradle assembleRelease
          fi

      - name: Rename APK
        run: |
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/Muesic_${{ github.ref_name }}.apk
          elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            mv app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/Muesic_${{ github.ref_name }}.apk
          fi

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            app/build/outputs/apk/release/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
